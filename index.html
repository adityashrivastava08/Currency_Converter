<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter | Premium Currency Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- Ambient Moving Glow Background Blobs -->
    <div class="glow-blob blob-1"></div>
    <div class="glow-blob blob-2"></div>
    <div class="glow-blob blob-3"></div>

    <div class="container">
      <header>
        <div class="logo">
          <div class="logo-icon">
            <i class="fa-solid fa-right-left"></i>
          </div>
          <h1>Currenza</h1>
        </div>
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Theme">
          <i class="fa-solid fa-sun"></i>
        </button>
      </header>

      <form id="converter-form">
        <!-- Amount Input Group -->
        <div class="input-group amount-group">
          <label for="amount">Enter Amount</label>
          <div class="input-wrapper">
            <span class="currency-symbol">$</span>
            <input id="amount" value="1" type="number" min="0" step="any" placeholder="0.00" autocomplete="off" />
          </div>
        </div>

        <!-- Currency Dropdowns Group -->
        <div class="dropdown-section">
          <!-- From Currency -->
          <div class="dropdown-wrapper from">
            <label>From</label>
            <div class="custom-select-container" id="from-select-container">
              <div class="selected-option" role="combobox" aria-haspopup="listbox" aria-expanded="false" tabindex="0" id="from-selected">
                <img src="https://flagsapi.com/US/flat/64.png" alt="US Flag" class="flag-img" />
                <span class="currency-code">USD</span>
                <i class="fa-solid fa-chevron-down caret"></i>
              </div>
              <div class="dropdown-list-wrapper hidden" id="from-list-wrapper">
                <div class="search-box">
                  <i class="fa-solid fa-magnifying-glass"></i>
                  <input type="text" placeholder="Search currency..." class="search-input" />
                </div>
                <ul class="options-list" role="listbox"></ul>
              </div>
              <!-- Hidden select for compatibility -->
              <select name="from" id="native-from" style="display: none;"></select>
            </div>
          </div>

          <!-- Swap Button -->
          <div class="swap-wrapper">
            <button type="button" class="swap-btn" id="swap-btn" aria-label="Swap Currencies">
              <i class="fa-solid fa-arrow-right-arrow-left"></i>
            </button>
          </div>

          <!-- To Currency -->
          <div class="dropdown-wrapper to">
            <label>To</label>
            <div class="custom-select-container" id="to-select-container">
              <div class="selected-option" role="combobox" aria-haspopup="listbox" aria-expanded="false" tabindex="0" id="to-selected">
                <img src="https://flagsapi.com/IN/flat/64.png" alt="IN Flag" class="flag-img" />
                <span class="currency-code">INR</span>
                <i class="fa-solid fa-chevron-down caret"></i>
              </div>
              <div class="dropdown-list-wrapper hidden" id="to-list-wrapper">
                <div class="search-box">
                  <i class="fa-solid fa-magnifying-glass"></i>
                  <input type="text" placeholder="Search currency..." class="search-input" />
                </div>
                <ul class="options-list" role="listbox"></ul>
              </div>
              <!-- Hidden select for compatibility -->
              <select name="to" id="native-to" style="display: none;"></select>
            </div>
          </div>
        </div>

        <!-- Conversion Result Output Box -->
        <div class="result-container">
          <span class="result-label">Exchange Rate</span>
          <div class="msg">1 USD = 83.45 INR</div>
          <div class="update-time" id="update-time">Rates update automatically</div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="convert-btn">
          <span>Get Exchange Rate</span>
          <div class="btn-loader hidden">
            <div class="spinner"></div>
          </div>
        </button>
      </form>

      <!-- Quick Conversion Grid Dashboard -->
      <section class="quick-conversions">
        <h3>Popular Conversions</h3>
        <div class="conversions-grid" id="conversions-grid">
          <!-- Populated dynamically by JS -->
          <div class="grid-card skeleton"></div>
          <div class="grid-card skeleton"></div>
          <div class="grid-card skeleton"></div>
          <div class="grid-card skeleton"></div>
        </div>
      </section>
    </div>

    <!-- Notification Toast -->
    <div class="toast" id="toast">
      <div class="toast-content">
        <i class="fa-solid fa-circle-exclamation toast-icon"></i>
        <div class="toast-details">
          <span class="toast-title">Error</span>
          <span class="toast-msg">Please enter a valid amount</span>
        </div>
      </div>
      <button class="toast-close" id="toast-close" aria-label="Close Toast">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <script src="codes.js"></script>
    <script src="app.js"></script>
  </body>
</html>
